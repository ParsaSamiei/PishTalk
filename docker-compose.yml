name: pishtalk

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pishtalk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pishtalk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pishtalk"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    image: ghcr.io/parsasamiei/pishtalk:migrator
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  seeder:
    image: ghcr.io/parsasamiei/pishtalk:seeder
    build:
      context: .
      target: seeder
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrator:
        condition: service_completed_successfully

  # --- Analytics (see docs/10_ANALYTICS.md) ---------------------------------
  # Self-hosted Umami, served at https://pishtalk.ir/analytics via Nginx.
  # Separate DB from the app's own Postgres on purpose: unrelated schema,
  # and analytics writes shouldn't contend with app traffic.
  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}
      POSTGRES_DB: umami
    volumes:
      - umami_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    # BASE_PATH is a Next.js build-time value, so there's no official
    # ghcr.io image pre-built for a /analytics subpath — it has to be built
    # locally from source with the build arg baked in. Pin a tag so `docker
    # compose build` doesn't silently pick up upstream changes; bump it
    # deliberately when you want to upgrade Umami.
    build:
      context: ./umami-src
      args:
        BASE_PATH: /analytics
    image: pishtalk-umami:v3.2.0-analytics
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      BASE_PATH: /analytics
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
    depends_on:
      umami-db:
        condition: service_healthy

  app:
    image: ghcr.io/parsasamiei/pishtalk:latest
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - uploads:/app/public/uploads
      # Support receipts. Kept out of the `uploads` volume on purpose: that one
      # is mounted under public/ and is served without authentication, while
      # receipts contain supporters' bank details and are only readable through
      # /api/admin/receipts/[id]/image. Without this mount the images land on
      # the container's writable layer and are lost on the next image update,
      # leaving database rows pointing at files that no longer exist.
      - receipts:/app/private-uploads
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://pishtalk.ir}
      FARAZSMS_API_KEY: ${FARAZSMS_API_KEY:?set FARAZSMS_API_KEY in .env, see docs.farazsms.com}
      FARAZSMS_LINE_NUMBER: ${FARAZSMS_LINE_NUMBER:?set FARAZSMS_LINE_NUMBER in .env}
      # Optional. Both must be set for the tracker script to render at all
      # (see app/layout.tsx). Read server-side at request time, not baked
      # in at build time, so plain runtime env vars are fine here.
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
    depends_on:
      seeder:
        condition: service_completed_successfully
      umami:
        condition: service_started

volumes:
  pgdata:
  uploads:
  receipts:
  umami_pgdata:
