services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pishtalk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pishtalk
    volumes:
      - pishtalk_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pishtalk"]
      interval: 5s
      timeout: 5s
      retries: 10
      ports:
      - "127.0.0.1:5432:5432"

migrator:
    image: ghcr.io/parsasamiei/pishtalk:migrator
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

app:
    image: ghcr.io/parsasamiei/pishtalk:latest
    build:
      context: .
      target: runner
      restart: unless-stopped
      ports:
        - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env, generate with: npx auth secret}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://pishtalk.ir}
    depends_on:
      seeder:
        condition: service_completed_successfully

volumes:
  pishtalk_db:
